<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script>
        // GitHub Pages SPA redirect
        // เก็บ path ไว้ใน sessionStorage แล้ว redirect ไปหน้าหลัก
        var path = location.pathname.replace('/KuanBadWeb', '');
        sessionStorage.setItem('spa-redirect', path + location.search + location.hash);
        location.replace('/KuanBadWeb/');
    </script>
</head>
<body></body>
</html>
